services:
  mei-facil-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      CHROMIUM_PATH: /usr/bin/chromium
      PROFILE_DIR: /app/chrome-profile
      POLL_MS: 3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - mei-chrome-profile:/app/chrome-profile
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true

  mei-worker-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN:?Configure WORKER_DOMAIN no arquivo .env}
    depends_on:
      - mei-facil-worker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  mei-chrome-profile:
  caddy-data:
  caddy-config:
